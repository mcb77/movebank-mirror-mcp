# Default mode: HTTP / SSE on 127.0.0.1:8090. movebank-mirror-mcp runs as
# a long-lived daemon; multiple MCP clients can connect to the same
# instance over Spring AI's SSE transport.
#
# To run as a stdio subprocess instead (the original Claude-Code-
# launches-it model), activate the 'stdio' profile via either:
#   - the --stdio CLI flag (handled in McpServerApplication.main)
#   - MOVEBANK_MIRROR_MCP_STDIO=true env var (same)
#   - --spring.profiles.active=stdio
# See application-stdio.yml for the stdio-mode overrides.
spring:
  main:
    banner-mode: off

  ai:
    mcp:
      server:
        name: movebank-mirror-mcp
        version: 0.0.1
        type: SYNC
        stdio: false
        instructions: |
          Tools for querying a local Movebank mirror: a copy of Movebank
          studies on this computer, written by movebank-mirror. Events come
          in Movebank's order and with Movebank's deployment assignment.
          Use list_studies + get_study to discover what's available; use
          summarize_events before download_events_to_file to avoid pulling
          millions of rows into context.

# HTTP server config (ignored in stdio mode). Bound to 127.0.0.1 by
# default because the MCP server has no authentication; only expose
# externally behind a reverse proxy that adds auth.
server:
  port: 8090
  address: 127.0.0.1

# The mirror directory written by movebank-mirror. Set it with the
# MOVEBANK_MIRROR_DIR env var.
movebank:
  mirror:
    dir: ${MOVEBANK_MIRROR_DIR:}
