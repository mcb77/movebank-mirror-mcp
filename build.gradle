plugins {
    id 'java'
    id 'application'
    id 'org.springframework.boot' version '3.5.7'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'de.firetail.compat.movebank'
version = '0.0.1'
description = 'MCP server that exposes a local Movebank mirror as LLM-callable tools.'

base {
    archivesName = 'movebank-mcp'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springAiVersion', '1.1.7')
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

dependencies {
    // MCP server. Both transports included so a single binary can run
    // as either a stdio subprocess (default Claude Code registration)
    // or a long-lived HTTP/SSE daemon. McpServerApplication.main picks
    // one based on --stdio flag or MOVEBANK_MCP_STDIO env var; default
    // is HTTP. The unused starter's auto-config is suppressed at
    // startup.
    implementation 'org.springframework.ai:spring-ai-starter-mcp-server'
    implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webmvc'

    implementation 'org.springframework.boot:spring-boot-starter'

    // Reads the mirror directory (de.firetail.compat.movebank.mirror.reader, new in
    // movebank-mirror 0.0.4). Until 0.0.4 is on Maven Central, gradle.properties
    // sets localMovebankMirror to build against ../movebank-mirror.
    implementation 'de.firetail.compat.movebank:movebank-mirror:0.0.4'

    // OpenCSV for writing download_events_to_file.
    implementation 'com.opencsv:opencsv:5.9'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly  'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'de.firetail.compat.movebank.mcp.McpServerApplication'
    applicationName = 'movebank-mcp'
}

springBoot {
    mainClass = 'de.firetail.compat.movebank.mcp.McpServerApplication'
}

// Read by a future ManifestVersionProvider for --version. Applied to both
// jar and bootJar (Spring Boot's bootJar doesn't inherit by default).
tasks.withType(Jar).configureEach {
    manifest {
        attributes('Implementation-Version': project.version)
    }
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'skipped', 'failed'
        exceptionFormat = 'full'
        showStandardStreams = true
    }
}

wrapper {
    gradleVersion = '8.13'
    distributionType = org.gradle.api.tasks.wrapper.Wrapper.DistributionType.ALL
}
