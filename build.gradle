plugins {
    id 'java'
    id 'application'
    id 'org.springframework.boot' version '3.5.7'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'de.firetail.compat.movebank'
version = '0.0.1'
description = 'MCP server that exposes a movebank-mirror-api as LLM-callable tools.'

base {
    archivesName = 'movebank-mcp'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springAiVersion', '1.0.0')
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

dependencies {
    // MCP server (stdio transport bundled by default in this starter).
    implementation 'org.springframework.ai:spring-ai-starter-mcp-server'

    // For HTTP calls to a running movebank-mirror-api.
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework:spring-web'

    // OpenCSV for streaming CSV passthrough on download_events_to_file.
    implementation 'com.opencsv:opencsv:5.9'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly  'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'de.firetail.compat.movebank.mcp.McpServerApplication'
    applicationName = 'movebank-mcp'
}

springBoot {
    mainClass = 'de.firetail.compat.movebank.mcp.McpServerApplication'
}

// Read by a future ManifestVersionProvider for --version. Applied to both
// jar and bootJar (Spring Boot's bootJar doesn't inherit by default).
tasks.withType(Jar).configureEach {
    manifest {
        attributes('Implementation-Version': project.version)
    }
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'skipped', 'failed'
        exceptionFormat = 'full'
        showStandardStreams = true
    }
}

wrapper {
    gradleVersion = '8.13'
    distributionType = org.gradle.api.tasks.wrapper.Wrapper.DistributionType.ALL
}
